name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stamp version from git tag
        run: |
          VER="${GITHUB_REF_NAME#v}"
          echo "$VER" > VERSION
          sed -i "s/^version: .*/version: ${VER}/" skill/SKILL.md
      - run: make package
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            jetmemo-skill-*.zip
          generate_release_notes: true
