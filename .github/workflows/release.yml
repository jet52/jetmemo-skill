name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stamp version from git tag
        run: |
          VER="${GITHUB_REF_NAME#v}"
          echo "$VER" > VERSION
          sed -i "s/^version: .*/version: ${VER}/" skill/SKILL.md
      # package-all builds both archives: the plugin zip (Cowork / marketplace
      # upload, manifest at the root) and the standalone installer bundle.
      # Building only the latter is how jetredline v4.19.2 shipped without the
      # artifact most users actually install.
      - run: make package-all
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            jetmemo-plugin-*.zip
            jetmemo-skill-*.zip
          generate_release_notes: true

      # softprops can succeed while a glob matches nothing. Assert both landed.
      - name: Verify both archives attached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          missing=0
          for f in "jetmemo-plugin-v${VER}.zip" "jetmemo-skill-v${VER}.zip"; do
            gh release view "${GITHUB_REF_NAME}" --json assets \
              --jq '.assets[].name' | grep -qx "$f" \
              || { echo "FAIL: $f is not attached to ${GITHUB_REF_NAME}"; missing=1; }
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "both archives verified on ${GITHUB_REF_NAME}"
